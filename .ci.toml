repository = "https://github.com/colder219/ba-python-demo"

[runtime]
type = "auto"
version = "3.12"
base_image = "python:3.12-slim"
path = "."
build_command = ""
start_command = "python app.py"

[image]
registry = "dhi.io"
name = "colder219/ba-python-demo"

[kubernetes]
namespace = "ba-test"
deployment = "ba-python-demo"
container = "ba-python-demo"
selector = { app = "ba-python-demo" }

[kubernetes.service]
name = "ba-python-demo"
port = 80
target_port = 8080
